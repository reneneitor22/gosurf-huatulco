<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIAG — Go Surf</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0b0b0b;color:#f4f1ec;font-family:ui-monospace,Menlo,monospace;font-size:13px}

  /* header identico al del sitio */
  header{
    position:sticky;top:0;z-index:300;height:64px;background:#0b0b0b;
    display:flex;align-items:center;justify-content:space-between;
    padding-inline:18px;border-bottom:1px solid #ff3b21;
  }
  header b{color:#ff3b21;font-size:15px}

  /* franja de referencia: si ves ESTO arriba del header, el header no esta pegado */
  .ref{position:fixed;top:0;left:0;right:0;height:6px;background:lime;z-index:9999}

  .panel{
    position:fixed;left:8px;right:8px;bottom:8px;z-index:5000;
    background:rgba(0,0,0,.92);border:2px solid #ff3b21;padding:10px;
    line-height:1.5;font-size:12px;
  }
  .panel div{display:flex;justify-content:space-between;gap:8px}
  .panel span:last-child{color:#ff3b21;text-align:right}
  .filler{padding:0 18px}
  .filler h2{font-size:34px;margin:26px 0 10px;color:#888;text-transform:uppercase}
  .filler p{margin-bottom:14px;color:#aaa}
</style>
</head>
<body>

<div class="ref"></div>

<header>
  <b>GO SURF — DIAG</b>
  <span id="hdr">·</span>
</header>

<div class="filler" id="filler"></div>

<div class="panel" id="panel">midiendo…</div>

<script>
  // relleno para poder hacer scroll
  var f = document.getElementById('filler'), s = '';
  for (var i = 1; i <= 30; i++) {
    s += '<h2>BLOQUE ' + i + '</h2><p>Texto de relleno para generar scroll y poder medir el header en movimiento.</p>';
  }
  f.innerHTML = s;

  var panel = document.getElementById('panel');
  var header = document.querySelector('header');

  function px(n){ return Math.round(n) + 'px'; }

  function medir(){
    var r = header.getBoundingClientRect();
    // que elemento esta pintado a 2px del borde superior de la pantalla
    var elTop = document.elementFromPoint(Math.round(innerWidth/2), 2);
    var elName = elTop ? (elTop.tagName + (elTop.className ? '.' + String(elTop.className).slice(0,14) : '')) : 'nada';

    var vv = window.visualViewport;
    var filas = [
      ['header top',        px(r.top) + (Math.round(r.top) === 0 ? '  OK' : '  <-- MAL')],
      ['a 2px del borde',   elName],
      ['safe-area-top',     getComputedStyle(document.documentElement).getPropertyValue('--sat') || sat()],
      ['scrollY',           Math.round(scrollY)],
      ['innerHeight',       innerHeight],
      ['vv.height',         vv ? Math.round(vv.height) : 'n/a'],
      ['vv.offsetTop',      vv ? Math.round(vv.offsetTop) : 'n/a'],
      ['vv.pageTop',        vv ? Math.round(vv.pageTop) : 'n/a'],
      ['vv.scale',          vv ? vv.scale : 'n/a'],
      ['standalone',        (navigator.standalone === true) ? 'SI (pantalla inicio)' : 'no (Safari)'],
      ['devicePixelRatio',  devicePixelRatio]
    ];

    var html = '';
    for (var i = 0; i < filas.length; i++) {
      html += '<div><span>' + filas[i][0] + '</span><span>' + filas[i][1] + '</span></div>';
    }
    panel.innerHTML = html;
  }

  // lee el safe area real
  function sat(){
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:0;height:env(safe-area-inset-top,0px);';
    document.body.appendChild(d);
    var v = d.getBoundingClientRect().height;
    d.remove();
    return Math.round(v) + 'px';
  }

  medir();
  addEventListener('scroll', medir, {passive:true});
  addEventListener('resize', medir);
  if (window.visualViewport) {
    visualViewport.addEventListener('scroll', medir);
    visualViewport.addEventListener('resize', medir);
  }
</script>

</body>
</html>
